# TarMAC configuration for SMAX 3s5z
LR: 5e-4
ENV_NAME: "3s5z"
MAP_NAME: "3s5z"
TOTAL_TIMESTEPS: 5e6
NUM_ENVS: 16
NUM_STEPS: 128
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 2
GAMMA: 0.99
GAE_LAMBDA: 0.95
CLIP_EPS: 0.2
ENT_COEF: 0.01
VF_COEF: 0.5
MAX_GRAD_NORM: 10.0
ANNEAL_LR: True

# Architecture
HIDDEN_DIM: 64
KEY_DIM: 16
COMM_PASSES: 1

ENV_KWARGS: {}
WANDB_PROJECT: "jaxmarl"
WANDB_MODE: "disabled"
WANDB_GROUP: "tarmac_smax"

# Periodic greedy evaluation (epsilon = 0) during training
TEST_DURING_TRAINING: True
TEST_INTERVAL: 0.05   # fraction of updates; eval every TEST_INTERVAL * NUM_UPDATES
TEST_NUM_STEPS: 128
TEST_NUM_ENVS: 128    # parallel eval environments
TEST_NUM_SEEDS: 5     # independent test seeds; mean/std logged to WandB

