# DICG configuration for SMAX 3s5z
LR: 5e-4
ENV_NAME: "3s5z"
MAP_NAME: "3s5z"
TOTAL_TIMESTEPS: 5e6
NUM_ENVS: 16
NUM_STEPS: 128
UPDATE_EPOCHS: 5
NUM_MINIBATCHES: 2
GAMMA: 0.99
GAE_LAMBDA: 0.95
CLIP_EPS: 0.2
ENT_COEF: 0.01
VF_COEF: 0.5
MAX_GRAD_NORM: 10.0
ANNEAL_LR: True

# Network architecture
EMBEDDING_DIM: 64
N_GCN_LAYERS: 2
ATTENTION_TYPE: "general"
RESIDUAL: True

ENV_KWARGS: {}
WANDB_PROJECT: "jaxmarl"
WANDB_MODE: "disabled"
WANDB_GROUP: "dicg_smax"

# Periodic greedy evaluation (epsilon = 0) during training
TEST_DURING_TRAINING: True
TEST_INTERVAL: 0.05   # fraction of updates; eval every TEST_INTERVAL * NUM_UPDATES
TEST_NUM_STEPS: 128
TEST_NUM_ENVS: 512    # parallel eval environments
TEST_NUM_SEEDS: 5     # independent test seeds; mean/std logged to WandB
