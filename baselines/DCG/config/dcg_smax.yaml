# DCG configuration for SMAX 3s5z
LR: 5e-4
ENV_NAME: "3s5z"
MAP_NAME: "3s5z"
TOTAL_TIMESTEPS: 5e6
NUM_ENVS: 16
NUM_STEPS: 128
BUFFER_SIZE: 50000
BUFFER_BATCH_SIZE: 32
NUM_EPOCHS: 4
GAMMA: 0.99
EPS_START: 1.0
EPS_FINISH: 0.05
EPS_DECAY: 0.5
MAX_GRAD_NORM: 10.0
TARGET_UPDATE_INTERVAL: 200
MSG_ITERATIONS: 8

# Network architecture
HIDDEN_DIM: 128
CG_EDGES: "full"

ENV_KWARGS: {}
WANDB_PROJECT: "jaxmarl"
WANDB_MODE: "disabled"
WANDB_GROUP: "dcg_smax"

# Periodic greedy evaluation (epsilon = 0) during training
TEST_DURING_TRAINING: True
TEST_INTERVAL: 0.05   # fraction of updates; eval every TEST_INTERVAL * NUM_UPDATES
TEST_NUM_STEPS: 128
TEST_NUM_ENVS: 512    # parallel eval environments
